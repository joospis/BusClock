; PlatformIO project for BusClock.
; The sources stay in BusClock/ so the folder still opens in the Arduino IDE.

[platformio]
src_dir = BusClock
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3
    adafruit/Adafruit GFX Library@^1
    bblanchon/ArduinoJson@^7

; Classic ESP32 dev board (README wiring)
[env:esp32dev]
board = esp32dev
