; PlatformIO project for BusClock.
;   pio run -t upload        build and flash the ESP32
;   pio test -e native       run the unit tests on this computer

[platformio]
default_envs = esp32dev

; Classic ESP32 dev board (README wiring)
[env:esp32dev]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3
    adafruit/Adafruit GFX Library@^1
    bblanchon/ArduinoJson@^7

; Unit tests for the pure headers in src/ (display.h, live_parse.h, logic.h)
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Isrc -Wall
lib_deps =
    bblanchon/ArduinoJson@^7
